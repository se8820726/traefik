name: traefik

services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - /etc/traefik/runtime/entrypoint.sh
    environment:
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./runtime:/etc/traefik/runtime:ro
      - ./data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

networks:
  proxy:
    external: true
    name: vnet
